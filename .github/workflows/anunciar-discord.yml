# ============================================================
# Anuncia en Discord cada versión nueva del launcher.
#
# Va en el repositorio donde se publican las releases
# (guille1914/skyrim-rp-client), en la ruta:
#   .github/workflows/anunciar-discord.yml
#
# Necesita un secreto llamado DISCORD_WEBHOOK con la URL del
# webhook del canal de anuncios:
#   GitHub → Settings → Secrets and variables → Actions →
#   New repository secret
# ============================================================

name: Anunciar versión en Discord

on:
  release:
    types: [published]

jobs:
  anunciar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar anuncio al webhook de Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          VERSION: ${{ github.event.release.tag_name }}
          TITULO: ${{ github.event.release.name }}
          NOTAS: ${{ github.event.release.body }}
          ENLACE: ${{ github.event.release.html_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Falta el secreto DISCORD_WEBHOOK"; exit 1
          fi

          # Discord admite 4096 caracteres en la descripción.
          NOTAS_CORTAS="$(printf '%s' "${NOTAS:-Nueva versión disponible.}" | head -c 3800)"

          jq -n \
            --arg titulo "Aestherius Launcher ${VERSION}${TITULO:+ · $TITULO}" \
            --arg notas "$NOTAS_CORTAS" \
            --arg enlace "$ENLACE" \
            '{
              username: "Aestherius",
              content: "@everyone",
              allowed_mentions: { parse: ["everyone"] },
              embeds: [{
                title: $titulo,
                url: $enlace,
                description: ($notas + "\n\nEl launcher se actualizará solo la próxima vez que lo abras."),
                color: 13935427
              }]
            }' > anuncio.json

          curl -sSf -H "Content-Type: application/json" -d @anuncio.json "$DISCORD_WEBHOOK"
          echo "Anuncio enviado."
